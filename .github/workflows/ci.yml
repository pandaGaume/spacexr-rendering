name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
# A new push to a branch stops the run of the commit it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Packages: build, format, lint, types and tests of every workspace, examples included, without their bundles.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: spacexr-rendering
      - uses: ./spacexr-rendering/.github/actions/framework
      - name: Check rendering
        working-directory: spacexr-rendering
        run: npm run check
  # The production bundle of each example, one example per runner, beside the check.
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - babylon-earth
          - babylon-google-3d-tiles
          - babylon-implicit-grid-mapzen
          - babylon-mars
          - babylon-moon
          - babylon-vector-terrain
    steps:
      - uses: actions/checkout@v7
        with:
          path: spacexr-rendering
      - uses: ./spacexr-rendering/.github/actions/framework
      - name: Build ${{ matrix.example }}
        working-directory: spacexr-rendering
        run: |
          npm run build
          npm run build --workspace examples/${{ matrix.example }}
